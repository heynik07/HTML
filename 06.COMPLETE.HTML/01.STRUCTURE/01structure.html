
<!DOCTYPE html>
<!-- Browser ko batata hai ki ye document HTML5 mein likha gaya hai.-->


<html lang="en">
<!-- HTML tag poore webpage ka root element (main container) hota hai. Saare HTML elements isi ke andar likhe jaate hain. lang="en" batata hai ki webpage ki primary language English hai.-->


<head>
<!-- Head section mein webpage ki metadata aur settings likhi jaati hain.Iske andar di gayi information generally webpage par directly visible nahi hoti.-->


<meta charset="UTF-8">
<!-- charset character encoding define karta hai.UTF-8 ek character encoding standard hai jo English, Hindi,special symbols aur emojis jaise characters ko support karta hai.-->


<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--name="viewport" -->
    <!-- name metadata ka type batata hai.
    <    viewport batata hai ki ye metadata viewport settings ke
    <    baare mein hai.-->

    <!--width=device-width -->
    <!-- Viewport ki width ko device ki screen width ke according  
    <    set karta hai.-->

    <!--initial-scale=1.0 -->
    <!-- Webpage open hone par initial zoom level 100% (normal size) rakhta hai.-->


<title>My Website</title>
    <!-- Title tag webpage ka title define karta hai.
    <    Ye browser ke tab mein display hota hai.
    <    Search engines bhi ise search results mein title ke roop <    mein use kar sakte hain.-->
