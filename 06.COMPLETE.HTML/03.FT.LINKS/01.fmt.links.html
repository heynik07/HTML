<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocol, Domain, Path</title>
</head>
<body>
<!-- <a> tag: Clickable link banane ke liye use hota hai -->
<a href="https://www.google.com">Google</a>


<!-- href: Batata hai link par click karne se kahan jana hai -->
<a href="https://www.google.com">Visit Google</a>


<!-- target="_blank": Link ko new tab mein open karta hai -->
<a href="https://www.youtube.com" target="_blank">YouTube</a>


<!-- target="_self": Link ko current tab mein open karta hai (default behavior) -->
<a href="https://github.com" target="_self">GitHub</a>


<!-- title: Link ke baare mein extra information deta hai.
<Desktop par mouse hover karne par tooltip dikha sakta hai. -->
<a href="https://www.google.com" title="Search Information on Google">Google</a>


<!-- Complete example: href + target + title -->
<a href="https://www.google.com"
   target="_blank"
   title="Search Information on Google">
   Search on Google
</a>
