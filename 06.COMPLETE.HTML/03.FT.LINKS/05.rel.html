<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- rel = Relationship; batata hai ki tumhari website aur linked website ke beech kya relation hai. -->

    <!-- 1. noopener:
    Maan lo tumhari website adi.in se koi link new tab mein open karta hai.
    Noopener new tab wali website ko tumhari original website control karne se rokta hai.
    Ye security ke liye hai. -->

    <!-- 2. noreferrer:
    Maan lo user tumhari website adi.in se google.com par jata hai.
    Noreferrer ki wajah se Google ko referrer information nahi milegi.
    Yani Google ko pata nahi chalega ki user adi.in se aaya hai.
    Ye privacy ke liye hai. -->

    <a href="https://google.com" target="_blank" rel="noopener noreferrer">
    Visit Google
</a>
</body>
</html>
