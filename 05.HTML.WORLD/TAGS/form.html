
<form>
    <h2>Student Registration Form</h2>
    <label for="name">Full Name :</label>
    <input id="name" type="text" name="name" placeholder="Enter Your Full Name" required maxlength="30">
    <br>
    <br>
    <label for="pass">Password :</label>
    <input id="pass" type="password" name="password" placeholder="Enter Your Password" required >

    <br>
    <br>
    <label for="email">Email :</label>
    <input id="email" type="email" name="email" placeholder="Enter Your Email" required >

    <br>
    <br>
    <label for="age">Age :</label>
    <input id="age" type="number" placeholder="Enter Your Age" name="age" required min="18" max="25">

    <br>
    <br>
    <label for="dob">Date of Birth :</label>
    <input id="dob" type="date" name="dob"  required >

    <br>
    <br>
    <label>Gender :</label>
    <input type="radio" name="gender" value="male" id="male" checked>
    <label for="male">Male</label>
    <input type="radio" name="gender" value="female" id="female">
    <label for="female">Female</label>
     
    <br>
    <br>

    <label for="course">Course</label>
    <select name="course" id="course">
        <option value="bca">BCA</option>
        <option value="mca">MCA</option>
        <option value="btech" selected>Btech</option>
    </select>

    <br>
    <br>
    <label>Subject :</label>
    <input type="checkbox" name="sub" value="math" id="math" >
    <label for="math">Math</label>
    <input type="checkbox" name="sub" value="physics" id="physics" >
    <label for="physics">Physics</label>
    <input type="checkbox" name="sub" value="cs" id="cs" >
    <label for="cs">CS</label>

    <br>
    <br>
    <label for="city">City :</label>
    <select id="city" name="city">
        <option value="delhi">Delhi</option>
        <option value="patna" selected>Patna</option>
        <option value="mumbai">mumbai</option>
    </select>

    <br>
    <br>
    <label for="about">About Yourself</label>
    <br>
    <br>
    <textarea id="about" name="feedback" cols="35" rows="6" placeholder="About Yourself"></textarea>

    <br>
    <br>
    <button type="reset">Reset</button>
    <br>
    <br>
    <button type="submit">Submit</button>
</form>
