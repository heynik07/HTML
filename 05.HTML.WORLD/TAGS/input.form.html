<form>
    <h2>Student Registration Form</h2>
    <label for="fullname">Full Name</label>
    <br>
    <br>
        <input type="text" placeholder="Enter your full name" maxlength="30" required id="fullname" name="fullname">

    <br>
    <br>
    <label for="email">Email</label>
    <br>
    <br>
        <input type="email" placeholder="Enter your Email" required id="email" name="email">
    <br>
    <br>
    <label for="password">Password</label>
    <br>
    <br>
        <input type="password" placeholder="Enter your Password" required id="password" name="password">

    <br>
    <br>
    <label for="phone">Phone Number</label>
    <br>
    <br>
        <input type="tel" placeholder="Enter your Phone number" required id="phone" name="phone">

    <br>
    <br>
    <label for="dob">Date of Birth</label>
    <br>
    <br>
        <input type="date"  required id="dob" name="dob">

    <br>
    <br>
    <button type="submit">Submit</button>

    <br>
    <br>
    <button type="reset">Reset</button>
</form>
